<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的小店</title>
  <link rel="icon" href="/img/12m-bundle-icon-W101.png">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      try {
        var d = localStorage.getItem('dz-theme');
        if (d === 'dark' || (!d && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/vendor/echarts.min.js"></script>
</head>
<body>
  <div id="app">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo"></span>
          <span>{{ app.title }}</span>
        </div>
        <nav class="menu">
          <a v-for="m in menus" :key="m.key" class="menu-item" :class="{ active: page === m.key }" @click="goto(m.key)">
            <span class="m-icon" v-html="iconHtml(m.icon)"></span>
            <span>{{ m.title }}</span>
            <span v-if="updateInfo.latest && m.key==='settings'" class="menu-badge">更新</span>
          </a>
        </nav>

        <div class="side-foot rate-panel">
          <div class="rate-main" :title="'数据来源：' + rateSourceText">
            <span class="rate-label">汇率</span>
            <span class="rate-value">$1 = ¥<b>{{ rateText }}</b></span>
            <button class="rate-refresh" @click="refreshRate" :disabled="rateBusy" title="重新获取汇率">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" :class="{ spin: rateBusy }">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
            </button>
          </div>
          <div class="rate-meta">更新于 {{ rateTimeText }}</div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="crumb">
            <span class="crumb-title">{{ currentMenu && currentMenu.title }}</span>
            <span class="crumb-sub" v-if="currentMenu && currentMenu.sub">{{ currentMenu.sub }}</span>
          </div>
          <div class="topbar-right">
            <span class="saved-tip" v-if="savedTip">{{ savedTip }}</span>
            <button class="theme-btn" @click="toggleDark" :title="dark ? '切换到日间模式' : '切换到夜间模式'">
              <svg v-if="!dark" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <svg v-else viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <button class="btn btn-ghost btn-sm" @click="doShutdown">
              <span class="power">&#9211;</span> 退出程序
            </button>
          </div>
        </header>
        <main class="content">
          <component :is="'page-' + page"></component>
        </main>
      </div>
    </div>

    <toast-view></toast-view>
    <confirm-view></confirm-view>
    <modal-view></modal-view>
  </div>

  <script src="/js/fmt.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/suppliers.js"></script>
  <script src="/js/pages/products.js"></script>
  <script src="/js/pages/sales.js"></script>
  <script src="/js/pages/orders.js"></script>
  <script src="/js/pages/report.js"></script>
  <script src="/js/pages/backup.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
